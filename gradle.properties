org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# --- Minecraft / loader ---
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.182
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Parchment gives readable parameter names in the decompiled Minecraft sources.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# --- Cobblemon ---
# Cobblemon 1.8.1 is built for Minecraft 1.21.1 / NeoForge 21.1.x.
cobblemon_version=1.8.1+1.21.1
# Cobblemon is written in Kotlin and needs Kotlin For Forge at runtime.
kff_version=5.10.0

# --- Mod metadata ---
mod_id=battleclarity
mod_name=Cobblemon Battle Clarity
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.arsnyde.battleclarity
mod_authors=arsnyde
mod_description=Makes the blocks that block your view of a Cobblemon battle disappear while the battle is running, and puts them back when it ends.
