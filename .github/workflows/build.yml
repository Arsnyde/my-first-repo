name: Build mod jar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace --console=plain

      - name: Upload the jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: battleclarity-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Publish as a downloadable release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -1)
          echo "Publishing $JAR"
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Cobblemon Battle Clarity - latest build" \
            --notes "Automatic build of the latest commit on main. Drop the .jar into your mods folder. Requires Minecraft 1.21.1, NeoForge 21.1.x, Cobblemon 1.8.x and Kotlin For Forge."
          gh release upload latest "$JAR" --clobber

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/reports/**
          if-no-files-found: ignore
